name: release

# The shared plugin-ci workflow builds a bundle but only delivers it to
# Mattermost's own S3 bucket, which a third-party plugin cannot write to. So a
# tag would otherwise produce no downloadable artifact at all — and the
# Marketplace submission requires a link someone can install from.
on:
  push:
    tags:
      - "v*"
  # Lets a release be re-cut without moving the tag, if the upload itself failed.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build a release for
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The version is derived from git describe, so the full history and
          # tags have to be present or every build claims to be 0.0.0.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build the plugin bundle
        run: make dist

      - name: Check the bundle carries every architecture
        # A bundle missing an architecture installs fine and then fails to start
        # on those servers, which is how the To Do plugin ended up with a
        # four-year-old issue about ARM. Fail the release instead.
        run: |
          set -euo pipefail
          bundle=$(ls dist/*.tar.gz)
          echo "checking $bundle"

          # Listed once into a variable rather than piped per check: `tar | grep -q`
          # makes tar die of SIGPIPE when grep exits early, and under pipefail
          # that reads as "the file is missing" for a bundle that is perfectly fine.
          contents=$(tar -tzf "$bundle")

          for entry in \
            server/dist/plugin-linux-amd64 \
            server/dist/plugin-linux-arm64 \
            server/dist/plugin-darwin-amd64 \
            server/dist/plugin-darwin-arm64 \
            server/dist/plugin-windows-amd64.exe \
            webapp/dist/main.js
          do
            case "$contents" in
              *"$entry"*) echo "  ok: $entry" ;;
              *)
                echo "::error::bundle is missing $entry"
                echo "bundle contains:"
                echo "$contents"
                exit 1
                ;;
            esac
          done

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
